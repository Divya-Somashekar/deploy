apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  # Wave 0: after the operator's CRDs exist, before any service's ExternalSecret at wave 1.
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: default
  source:
    repoURL: "https://github.com/Divya-Somashekar/deploy.git"
    targetRevision: main
    path: platform/external-secrets
  # The ClusterSecretStore is cluster-scoped, so this namespace only decides where namespaced
  # resources in the path would land. It is the operator's own namespace, which is also where the
  # bootstrap credential Secret lives.
  destination: { server: "https://kubernetes.default.svc", namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # SkipDryRunOnMissingResource because sync waves order Applications but do not wait for the
    # operator's CRDs to be established; the retry block covers the gap.
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
