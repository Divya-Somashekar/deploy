apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
  # Wave -1 alongside the other operators: it installs CRDs that the external-secrets Application
  # at wave 0 and catalog-service's ExternalSecret at wave 1 both depend on.
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: "https://charts.external-secrets.io"
    chart: external-secrets
    targetRevision: "2.11.0"
  destination: { server: "https://kubernetes.default.svc", namespace: external-secrets }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # ServerSideApply for the same reason as eck and cnpg: the CRDs exceed the annotation size
    # limit that client-side apply uses to record the last-applied configuration.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
