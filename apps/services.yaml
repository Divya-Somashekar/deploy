# One ApplicationSet instead of an Application per service.
#
# Each service declares itself in services/<dir>/overlays/local/app.yaml, and the git files
# generator turns every one of those into an Application. Onboarding a project is still "add a
# directory", not "copy this file and edit four fields" — which is the whole reason deploy/ became
# its own repo.
#
# The namespace comes from that file rather than from the directory name, because a namespace is an
# RBAC, quota and NetworkPolicy boundary: it belongs to whoever owns the thing, which is a team or a
# product, not an individual process. catalog-service and search-service are two services of one
# product and share the `product-search` namespace; deriving the namespace from the directory would
# have forced a namespace per service and, with it, two copies of every datastore.
#
# A directory only appears here once it has an app.yaml and a kustomization.yaml that renders, so a
# project without manifests yet simply is not generated.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/Divya-Somashekar/deploy.git"
        revision: main
        files:
          - path: services/*/overlays/local/app.yaml
  template:
    metadata:
      name: '{{ .name }}'
      # A service now ships its own datastore, so its Application owns stateful resources.
      # Without this, deleting or renaming the Application leaves the database running and owned
      # by nobody — `prune: true` only covers resources that vanish from a *live* Application.
      # The trade-off is intended: removing a service from git deletes its data.
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: default
      source:
        repoURL: "https://github.com/Divya-Somashekar/deploy.git"
        targetRevision: main
        # path.path is the directory holding app.yaml, i.e. the overlay itself.
        path: '{{ .path.path }}'
      destination:
        server: "https://kubernetes.default.svc"
        # Must match the `namespace:` in the overlay's kustomization.yaml. They are both set from
        # the same app.yaml value by hand; if they ever diverge ArgoCD reports it rather than
        # silently applying to the wrong place.
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
        retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
