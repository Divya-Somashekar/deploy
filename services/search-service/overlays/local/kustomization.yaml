apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Matches `namespace:` in this overlay's app.yaml, which is what the ApplicationSet uses.
namespace: product-search
resources:
- ../../base
# `search-service` is the contract with product-search's release.yaml, which runs
#   kustomize edit set image search-service=ghcr.io/divya-somashekar/search-service:<sha>
# Renaming it here silently stops that repo's deploys from updating the tag.
# The placeholder tag means the pod sits in ImagePullBackOff until the first release lands.
images:
- name: search-service
  newName: ghcr.io/divya-somashekar/search-service
  newTag: 2bed96dd79c9
