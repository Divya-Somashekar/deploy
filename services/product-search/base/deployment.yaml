apiVersion: apps/v1
kind: Deployment
metadata: { name: product-search, labels: { app.kubernetes.io/name: product-search } }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: product-search } }
  template:
    metadata: { labels: { app.kubernetes.io/name: product-search } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: product-search
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: demo }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://products-db-rw:5432/products" }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: products-db-app, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: products-db-app, key: password } }
            - { name: SPRING_ELASTICSEARCH_URIS, value: "http://search-es-http:9200" }
            - { name: SPRING_ELASTICSEARCH_USERNAME, value: elastic }
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: search-es-elastic-user, key: elastic } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }
          startupProbe:   { httpGet: { path: /actuator/health/liveness,  port: management }, periodSeconds: 5, failureThreshold: 36 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: management } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: management } }
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
