apiVersion: apps/v1
kind: Deployment
metadata: { name: chakra, labels: { app.kubernetes.io/name: chakra } }
spec:
  # Two replicas: chakra keeps its state in Redis, so scaling out is safe. The node also carries
  # Elasticsearch, Kibana, Postgres and two product-search pods, so this stays modest.
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: chakra } }
  template:
    metadata: { labels: { app.kubernetes.io/name: chakra } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: chakra
          # Unlike product-search, actuator shares the app port here — there is nothing to isolate.
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # Back to host/port now that there is no Sentinel to ask. chakra-redis-master is the
            # operator-created Service whose selector is the pod currently labelled master, so this
            # keeps pointing at the writable node if clusterSize is ever raised. Relaxed binding
            # overrides the `localhost` default in application.yml; no chakra code change.
            - { name: SPRING_DATA_REDIS_HOST, value: chakra-redis-master }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
          resources: { requests: { cpu: 150m, memory: 384Mi }, limits: { memory: 640Mi } }
          # Requires spring-boot-starter-actuator in chakra's build.gradle. Without it these 404 and
          # the pod never becomes ready.
          startupProbe:   { httpGet: { path: /actuator/health/liveness,  port: http }, periodSeconds: 5, failureThreshold: 36 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: http } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http } }
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
