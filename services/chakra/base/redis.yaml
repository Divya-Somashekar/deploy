# Redis for chakra: a single node run by the redis-operator Application at wave -1.
#
# One node, with a PVC and appendonly on. That fixes the half of the old setup that actually lost
# data — emptyDir with `--save ""` kept everything in RAM, so a restart started empty — and
# deliberately does not fix the other half: with no replica there is nothing to promote, so losing
# the pod still takes chakra's Redis down until it reschedules.
#
# No RedisSentinel here on purpose. Sentinel exists to elect a new primary from among replicas; with
# clusterSize 1 there is no candidate, so running Sentinels would cost three pods and buy nothing.
# Raising clusterSize is the point at which to add it back.
#
# Still chakra's own datastore in chakra's base/, per the rule in CLAUDE.md: only chakra uses it, so
# it does not belong in platform/. Promote it the day a second service needs Redis.
#
# Why an operator CR rather than the plain Deployment this used to be: it is the same pattern as
# CloudNativePG for Postgres and ECK for Elasticsearch, and it makes raising clusterSize plus adding
# a RedisSentinel a small edit later, rather than a rewrite.
apiVersion: v1
kind: ConfigMap
metadata: { name: chakra-redis-config }
data:
  # The key name is fixed by the operator; it mounts this file and appends it to redis.conf.
  # NOTE: a plain ConfigMap, not a configMapGenerator — kustomize would append a content hash to a
  # generated name and `additionalRedisConfig` below is a literal string, so the reference would
  # silently stop resolving.
  redis-additional.conf: |
    # appendonly, not `save`: the journal is replayed per command on restart rather than from the
    # last snapshot, so a crash loses at most the last second of writes.
    appendonly yes
    appendfsync everysec
    # noeviction, not allkeys-lru: this holds application data, not a pure cache, so failing a
    # write is honest where silently dropping keys is not.
    maxmemory 192mb
    maxmemory-policy noeviction
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata: { name: chakra-redis }
spec:
  # One node. Raise this to 3 (odd, so a majority can elect) and add a RedisSentinel to get
  # automatic failover; nothing else in this file has to change.
  clusterSize: 1
  redisConfig: { additionalRedisConfig: chakra-redis-config }
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    imagePullPolicy: IfNotPresent
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  # The operator's images run as 1000, not the 999 the plain redis image used.
  podSecurityContext: { runAsUser: 1000, fsGroup: 1000 }
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
