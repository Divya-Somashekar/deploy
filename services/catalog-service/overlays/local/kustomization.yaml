apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Matches what the `services` ApplicationSet derives from this directory's path.
namespace: product-search
resources:
- ../../base
# `catalog-service` is the contract with product-search's release.yaml, which runs
#   kustomize edit set image catalog-service=ghcr.io/divya-somashekar/catalog-service:<sha>
# Renaming it here silently stops that repo's deploys from updating the tag.
# The placeholder tag means the pod sits in ImagePullBackOff until the first release lands.
images:
- name: catalog-service
  newName: ghcr.io/divya-somashekar/catalog-service
  newTag: ff1e54d292a8
