apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Matches `namespace:` in this overlay's app.yaml, which is what the ApplicationSet uses.
namespace: product-search
resources:
- ../../base
# `catalog-service` is the contract with product-search's release.yaml, which runs
#   kustomize edit set image catalog-service=ghcr.io/divya-somashekar/catalog-service:<sha>
# Renaming it here silently stops that repo's deploys from updating the tag.
# The placeholder tag means the pod sits in ImagePullBackOff until the first release lands.
images:
- name: catalog-service
  newName: ghcr.io/divya-somashekar/catalog-service
  newTag: 2bed96dd79c9

# Non-secret image configuration. Deliberately in git rather than fetched through External Secrets:
# a bucket name is not a credential, and keeping it here means the repo shows what this environment
# points at, reviewable in a diff.
#
# A generator rather than plain env entries in the base, because the generated name carries a
# content hash — change the bucket and the Deployment rolls, instead of leaving running pods on the
# old value. Must match `terraform output images_bucket` in infra/live/dev/product-search.
configMapGenerator:
- literals:
  - CATALOG_IMAGES_BUCKET=product-search-images-dev-758808000552
  - AWS_REGION=eu-central-1
  name: catalog-images
