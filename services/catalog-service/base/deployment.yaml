apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog-service, labels: { app.kubernetes.io/name: catalog-service } }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: catalog-service } }
  template:
    metadata: { labels: { app.kubernetes.io/name: catalog-service } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: catalog-service
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 8081 }]
          env:
            # Loads the demo catalogue through Flyway. This service owns the schema.
            - { name: SPRING_PROFILES_ACTIVE, value: demo }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://products-db-rw:5432/products" }
            # CloudNativePG creates this Secret in this namespace; nothing is checked in.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: products-db-app, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: products-db-app, key: password } }
            # No Elasticsearch here: this service does not know search exists.
          envFrom:
            # CATALOG_IMAGES_BUCKET and AWS_REGION. Generated by the overlay, so its name carries
            # a content hash and a changed bucket rolls the pods instead of leaving them on a
            # stale value.
            - configMapRef: { name: catalog-images }
            # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Created by External Secrets Operator
            # from SSM, never checked in. Absent until the operator has synced, which is why this
            # is optional: without it the pod would CrashLoopBackOff on a fresh cluster instead of
            # starting and reporting unready.
            - secretRef: { name: catalog-aws, optional: true }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 768Mi } }
          startupProbe:   { httpGet: { path: /actuator/health/liveness,  port: management }, periodSeconds: 5, failureThreshold: 36 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness,  port: management } }
          # Readiness covers Postgres only; that is this service's single dependency.
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: management } }
          lifecycle: { preStop: { sleep: { seconds: 5 } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
