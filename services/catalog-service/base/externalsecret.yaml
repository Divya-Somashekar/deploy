# Materialises the catalog-aws Secret from SSM parameters that Terraform wrote.
#
# Namespaced and owned by this service, so it lives in the service's base/ for the same reason
# postgres.yaml does. Only the credentials come this way: the bucket name and region are not
# secret and are set in the overlay, where they are visible in git and diffable in review.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-aws
spec:
  # How often the operator re-reads the parameters. A rotated key reaches the pods within this
  # window without anyone touching the cluster — though the Deployment does not restart on its
  # own, so an in-place credential change needs a rollout to be picked up by running containers.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore

  target:
    name: catalog-aws
    # Owner: the operator creates the Secret and deletes it when this ExternalSecret goes away.
    # ArgoCD never sees that Secret in git, so it is not tracked and will not be pruned.
    creationPolicy: Owner

  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /dev/catalog-service/aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /dev/catalog-service/aws-secret-access-key
