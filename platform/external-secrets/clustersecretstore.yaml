# How the cluster reads configuration out of AWS SSM Parameter Store.
#
# This is back under platform/ rather than in a service's base/ because a ClusterSecretStore is
# cluster-scoped and every service will use this one — which is exactly the "promote it when a
# second service needs it" case. The ExternalSecret that consumes it stays with its service.
#
# apiVersion is v1. Chart 2.x serves external-secrets.io/v1 as the storage version and has
# v1beta1 disabled by default, so the v1beta1 examples that most guides still show will be
# rejected by the API server.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      # Parameter Store, not Secrets Manager: Standard parameters are free for both String and
      # SecureString, where Secrets Manager bills per secret per month.
      service: ParameterStore
      region: eu-west-3
      auth:
        secretRef:
          # The one credential installed by hand. The operator cannot fetch the key it needs in
          # order to fetch keys, so this Secret is created once from a Terraform output:
          #
          #   cd ~/repos/infra/live/dev/product-search
          #   terraform output -raw external_secrets_bootstrap_command | sh
          #
          # On EKS this whole auth block is replaced by IRSA on the operator's ServiceAccount and
          # no static key exists at all.
          #
          # namespace is required here because a ClusterSecretStore has no namespace of its own to
          # resolve the reference against.
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
