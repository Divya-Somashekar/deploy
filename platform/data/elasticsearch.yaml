apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata: { name: search }
spec:
  version: 9.4.5
  http: { tls: { selfSignedCertificate: { disabled: true } } }   # PoC only: plain HTTP inside the cluster
  nodeSets:
    - name: default
      count: 1
      config: { node.store.allow_mmap: false }
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              resources: { requests: { memory: 1536Mi, cpu: 500m }, limits: { memory: 1536Mi } }
